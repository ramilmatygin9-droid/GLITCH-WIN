<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #chat-box { width: 350px; height: 400px; background: #2c2c2c; border-radius: 10px; overflow-y: auto; padding: 15px; margin-bottom: 10px; }
        .message { background: #007bff; padding: 8px 12px; border-radius: 15px; margin-bottom: 10px; width: fit-content; max-width: 80%; align-self: flex-start; position: relative; }
        .ticks { font-size: 10px; margin-left: 5px; color: #d1d1d1; float: right; }
        .read { color: #00d4ff; } /* Синие галочки для прочитанного */
        input { width: 250px; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

<div id="chat-box"></div>
<div>
    <input type="text" id="msg" placeholder="Сообщение...">
    <button onclick="addMessage()">Отправить</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');

    function addMessage() {
        const input = document.getElementById('msg');
        if (!input.value) return;

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        
        // Добавляем текст + галочки
        msgDiv.innerHTML = `${input.value} <span class="ticks">✓</span>`;
        chatBox.appendChild(msgDiv);

        // Имитация доставки (через 1 сек)
        setTimeout(() => {
            msgDiv.querySelector('.ticks').innerText = "✓✓";
        }, 1000);

        // Имитация прочтения (через 3 сек)
        setTimeout(() => {
            msgDiv.querySelector('.ticks').classList.add('read');
        }, 3000);

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
