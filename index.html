<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Т-Банк Платёж</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #1c1c1e;
            --accent-blue: #4c94ff;
            --t-yellow: #ffdd2d;
            --success-green: #2c9a41;
            --text-gray: #929294;
            --transport-orange: #f59e4c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; overflow: hidden; }

        .screen { position: absolute; inset: 0; padding: 16px 20px env(safe-area-inset-bottom); display: flex; flex-direction: column; transition: filter 0.4s ease; }
        .blur-active { filter: blur(10px); pointer-events: none; }

        /* ЭКРАН ОПЛАТЫ */
        .header-pay { display: flex; justify-content: space-between; align-items: center; height: 44px; margin-bottom: 20px; }
        .close-link { color: var(--accent-blue); text-decoration: none; font-size: 17px; }
        .account-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
        .recipient-card { background: var(--transport-orange); border-radius: 20px; padding: 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
        .bus-icon-circle { width: 46px; height: 46px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden; flex-shrink: 0; }
        .bus-img { width: 100%; height: 100%; object-fit: cover; }
        .btn-pay-main { background: var(--t-yellow); color: #000; border: none; border-radius: 16px; padding: 18px; font-size: 16px; font-weight: 600; width: 100%; margin-top: auto; margin-bottom: 20px; }

        /* ЗАГРУЗКА */
        #loading-overlay { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; z-index: 50; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(255, 221, 45, 0.2); border-top: 4px solid var(--t-yellow); border-radius: 50%; animation: spin 0.8s linear infinite; }

        /* ЭКРАН АНИМАЦИИ ГАЛОЧКИ */
        #check-overlay { position: fixed; inset: 0; background: var(--bg-color); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .success-ring { width: 90px; height: 90px; background: var(--success-green); border-radius: 50%; display: flex; justify-content: center; align-items: center; transform: scale(0); opacity: 0; position: relative; z-index: 102; }
        .success-wave { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; margin-top: -50px; margin-left: -50px; background: var(--success-green); border-radius: 50%; opacity: 0; z-index: 101; filter: blur(20px); }
        .paid-text { font-size: 24px; font-weight: 600; margin-top: 25px; color: #fff; opacity: 0; transform: translateY(10px); z-index: 102; }

        /* ЭКРАН УСПЕХА (ЧЕК) */
        #success-screen { display: none; overflow-y: auto; background: #0b0b0b; padding: 0; }
        .top-status-bar { height: 44px; display: flex; justify-content: center; align-items: center; position: sticky; top: 0; background: #0b0b0b; z-index: 10; padding-top: 10px; }
        .t-label { background: var(--t-yellow); color: #000; padding: 4px 14px; border-radius: 20px; font-weight: 800; font-size: 13px; letter-spacing: 0.5px; }
        .receipt-content { padding: 10px 20px; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; }
        
        .avatar-main { width: 100px; height: 100px; border-radius: 50%; background: var(--transport-orange); display: flex; justify-content: center; align-items: center; margin-bottom: 20px; overflow: hidden; }
        .mcc-badge { background: rgba(255,255,255,0.08); color: var(--text-gray); padding: 4px 12px; border-radius: 20px; font-size: 14px; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
        .mcc-icon-small { width: 18px; height: 18px; border-radius: 50%; background: white; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .mcc-icon-small img { width: 100%; height: 100%; object-fit: cover; }
        
        .ignore-btn { background: #1c243d; border-radius: 14px; padding: 12px 24px; display: flex; flex-direction: column; align-items: center; margin-top: 20px; border: none; }
        .ignore-btn div:first-child { color: var(--accent-blue); font-size: 22px; font-weight: 300; }
        .ignore-btn div:last-child { color: var(--accent-blue); font-size: 13px; margin-top: 2px; }

        .fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, #0b0b0b 30%); }
        .btn-done { background: var(--t-yellow); color: #000; border: none; border-radius: 16px; padding: 18px; width: 100%; font-size: 17px; font-weight: 600; }

        /* АНИМАЦИИ */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes popIn { 100% { transform: scale(1); opacity: 1; } }
        @keyframes draw { 100% { stroke-dashoffset: 0; } }
        @keyframes fadeInUp { 100% { opacity: 1; transform: translateY(0); } }
        @keyframes wave-expand { 0% { transform: scale(0.8); opacity: 0; } 15% { opacity: 0.5; } 100% { transform: scale(10); opacity: 0; } }

        .ring-animate { animation: popIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards; }
        .wave-animate { animation: wave-expand 1.4s 0.4s cubic-bezier(0.15, 0, 0.2, 1) forwards; }
        .draw-check { animation: draw 0.4s 0.3s forwards ease-out; }
        .show-paid-text { animation: fadeInUp 0.5s 0.7s forwards; }
        .fade-in-item { opacity: 0; transform: translateY(15px); }
        .animate-item { animation: fadeInUp 0.6s ease-out forwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
    </style>
</head>
<body>

<div id="pay-screen" class="screen">
    <div class="header-pay">
        <a href="#" class="close-link">Закрыть</a>
        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/SBP_logo.svg" height="18">
        <div style="width: 50px;"></div>
    </div>
    <div class="account-card">
        <div style="color: var(--text-gray); font-size: 14px;">с Мой счет</div>
        <div style="font-size: 30px; font-weight: 700; margin-top: 4px;">567,21 ₽</div>
    </div>
    <div class="recipient-card">
        <div class="bus-icon-circle"><img src="IMG_5710.jpeg" class="bus-img"></div>
        <div>
            <div style="font-weight: 600;">АО «КПАТП №7»</div>
            <div style="font-size: 12px; opacity: 0.8;">Маршрут №31</div>
        </div>
    </div>
    <div style="padding: 0 5px;">
        <div style="font-size: 32px; font-weight: 700;">48 ₽</div>
        <div style="color: var(--text-gray); font-size: 13px; margin-top: 4px;">Комиссия не взимается</div>
    </div>
    <button class="btn-pay-main" id="pay-btn">Оплатить 48 ₽</button>
</div>

<div id="loading-overlay">
    <div class="spinner"></div>
</div>

<div id="check-overlay">
    <div class="success-wave" id="wave"></div>
    <div class="success-ring" id="ring">
        <svg width="40" height="30" viewBox="0 0 12 10" fill="none">
            <path style="stroke-dasharray: 100; stroke-dashoffset: 100;" id="check-svg" d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <div class="paid-text" id="paid-label">Оплачено!</div>
    <div id="paid-amount" class="paid-text" style="font-size: 34px; font-weight: 700; margin-top: 10px;">−48 ₽</div>
</div>

<div id="success-screen" class="screen">
    <div class="top-status-bar"><div class="t-label">Т-БАНК</div></div>
    
    <div class="receipt-content">
        <div style="width: 100%; display: flex; justify-content: flex-end; margin-bottom: 5px;">
            <div style="background: #2c2c2e; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;" onclick="location.reload()">×</div>
        </div>

        <div class="fade-in-item delay-1" style="color: var(--text-gray); font-size: 15px; margin-bottom: 25px;" id="current-time-display">4 мая • 14:58</div>
        
        <div class="avatar-main fade-in-item delay-1">
            <img src="IMG_5710.jpeg" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        
        <div class="fade-in-item delay-2" style="text-align: center;">
            <div style="font-size: 20px; font-weight: 600;">КрасноярскАвтоТранс QR</div>
            <div class="mcc-badge">
                <div class="mcc-icon-small"><img src="IMG_5710.jpeg"></div>
                <span>Местный транспорт • MCC 4111</span>
            </div>
        </div>

        <div class="fade-in-item delay-3" style="font-size: 42px; font-weight: 700; margin: 25px 0;">−48 ₽</div>
        
        <button class="ignore-btn fade-in-item delay-3">
            <div>∅</div>
            <div>Не учитывать</div>
        </button>
    </div>

    <div class="fixed-bottom fade-in-item delay-4">
        <button class="btn-done" onclick="location.reload()">Готово</button>
    </div>
</div>

<script>
    const btn = document.getElementById('pay-btn');
    const payScreen = document.getElementById('pay-screen');
    const loadingOverlay = document.getElementById('loading-overlay');
    const checkOverlay = document.getElementById('check-overlay');
    const successScreen = document.getElementById('success-screen');

    // Авто-дата
    const now = new Date();
    const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    document.getElementById('current-time-display').innerText = `${now.getDate()} ${months[now.getMonth()]} • ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;

    btn.addEventListener('click', () => {
        payScreen.classList.add('blur-active');
        loadingOverlay.style.display = 'flex';

        setTimeout(() => {
            loadingOverlay.style.display = 'none';
            payScreen.style.display = 'none';
            checkOverlay.style.display = 'flex';

            setTimeout(() => {
                document.getElementById('ring').classList.add('ring-animate');
                document.getElementById('wave').classList.add('wave-animate');
                document.getElementById('check-svg').classList.add('draw-check');
                document.getElementById('paid-label').classList.add('show-paid-text');
                document.getElementById('paid-amount').classList.add('show-paid-text');
                
                setTimeout(() => {
                    checkOverlay.style.display = 'none';
                    successScreen.style.display = 'block';
                    successScreen.querySelectorAll('.fade-in-item').forEach(item => item.classList.add('animate-item'));
                }, 2200);
            }, 100);
        }, 1200);
    });
</script>

</body>
</html>
