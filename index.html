<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Т-Банк</title>
    <!-- Подключаем библиотеку сканера -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #1c1c1e;
            --accent-blue: #4c94ff;
            --t-yellow: #ffdd2d;
            --success-green: #2c9a41;
            --text-gray: #929294;
            --transport-orange: #f59e4c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg-color); 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            overflow-x: hidden; 
            height: 100vh; 
        }

        /* ПАНЕЛЬ НАСТРОЕК */
        #settings-panel { position: fixed; inset: 0; background: #1c1c1e; z-index: 2000; display: flex; flex-direction: column; padding: 40px 20px; }
        .settings-input { background: #2c2c2e; border: 1px solid #444; color: #fff; padding: 15px; border-radius: 12px; font-size: 16px; margin-bottom: 20px; outline: none; }

        /* ЭКРАН СКАНЕРА */
        #scanner-screen { position: fixed; inset: 0; background: #000; z-index: 1500; display: none; flex-direction: column; }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { object-fit: cover !important; }
        .scanner-overlay { position: absolute; inset: 0; border: 2px solid var(--t-yellow); margin: 60px; border-radius: 20px; pointer-events: none; z-index: 1501; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); }

        /* ЭКРАНЫ */
        .screen { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--bg-color); }
        .blur-active { filter: blur(10px); pointer-events: none; }
        
        .top-status-bar { height: 50px; display: flex; justify-content: center; align-items: center; padding-top: 10px; }
        .t-label { background: var(--t-yellow); color: #000; padding: 4px 16px; border-radius: 20px; font-weight: 800; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }

        /* КНОПКА ЗАКРЫТЬ (КРЕСТИК) */
        .close-btn-wrapper { position: absolute; top: 15px; right: 15px; z-index: 100; }
        .close-circle { background: #2c2c2e; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; cursor: pointer; }

        /* ЭКРАН ОПЛАТЫ */
        #pay-screen { padding: 0 20px env(safe-area-inset-bottom); }
        .header-pay { display: flex; justify-content: space-between; align-items: center; height: 44px; margin-top: 5px; margin-bottom: 15px; }
        .close-link { color: var(--accent-blue); text-decoration: none; font-size: 17px; }
        .account-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
        .recipient-card { background: var(--transport-orange); border-radius: 20px; padding: 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 20px; color: #fff; }
        .bus-icon-circle { width: 46px; height: 46px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; overflow: hidden; flex-shrink: 0; }
        
        /* ЧЕК (SUCCESS SCREEN) */
        #success-screen { overflow-y: auto; padding-bottom: 120px; }
        .receipt-content { display: flex; flex-direction: column; align-items: center; padding: 0 20px; }
        .avatar-main { width: 90px; height: 90px; border-radius: 50%; background: #ff9d33; display: flex; justify-content: center; align-items: center; margin-top: 20px; margin-bottom: 15px; overflow: hidden; }
        .avatar-main img { width: 100%; height: 100%; object-fit: cover; }

        .transport-badge { background: #1c1c1e; padding: 6px 14px 6px 8px; border-radius: 20px; display: flex; align-items: center; gap: 8px; margin-top: 10px; }
        .mini-bus-circle { width: 26px; height: 26px; background: #ff9d33; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; overflow: hidden; }
        .mini-bus-icon { width: 100%; height: 100%; object-fit: cover; }
        .badge-text { color: var(--text-gray); font-size: 14px; }

        /* СЕКЦИЯ РЕКВИЗИТОВ */
        .details-section { width: 100%; margin-top: 30px; text-align: left; }
        .details-title { color: var(--text-gray); font-size: 12px; text-transform: uppercase; margin-bottom: 15px; font-weight: 500; letter-spacing: 0.3px; }
        .detail-row { margin-bottom: 18px; }
        .detail-label { color: var(--text-gray); font-size: 13px; margin-bottom: 4px; }
        .detail-value { color: #fff; font-size: 15px; line-height: 1.4; font-weight: 400; }

        /* КАРТОЧКА СЧЕТА В ЧЕКЕ */
        .post-pay-card { background: #181818; border-radius: 24px; padding: 18px; width: 100%; margin-top: 10px; }
        .card-inner { display: flex; align-items: center; gap: 12px; }
        .p-icon { width: 36px; height: 36px; background: var(--accent-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }

        /* КНОПКА ГОТОВО */
        .fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, #0b0b0b 20%); z-index: 100; }
        .btn-pay-main { background: var(--t-yellow); color: #000; border: none; border-radius: 16px; padding: 18px; font-size: 16px; font-weight: 600; width: 100%; }

        /* АНИМАЦИЯ ОПЛАТЫ */
        #check-overlay { position: fixed; inset: 0; background: var(--bg-color); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 500; }
        .success-ring { width: 90px; height: 90px; background: var(--success-green); border-radius: 50%; display: flex; justify-content: center; align-items: center; transform: scale(0); opacity: 0; position: relative; z-index: 502; }
        .success-wave { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; margin-top: -50px; margin-left: -50px; background: var(--success-green); border-radius: 50%; opacity: 0; z-index: 501; filter: blur(20px); }
        
        @keyframes wave-expand { 0% { transform: scale(0.8); opacity: 0; } 15% { opacity: 0.7; } 100% { transform: scale(20); opacity: 0; } }
        @keyframes popIn { 100% { transform: scale(1); opacity: 1; } }
        @keyframes fadeInUp { 100% { opacity: 1; transform: translateY(0); } }

        .ring-animate { animation: popIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49) forwards; }
        .wave-animate { animation: wave-expand 1.6s 0.3s cubic-bezier(0.15, 0, 0.2, 1) forwards; }
        .fade-in-item { opacity: 0; transform: translateY(15px); }
        .animate-item { animation: fadeInUp 0.6s ease-out forwards; }
        
        #loading-overlay { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; z-index: 600; }
        .spinner { width: 45px; height: 45px; border: 4px solid rgba(255, 221, 45, 0.2); border-top: 4px solid var(--t-yellow); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<!-- Настройки -->
<div id="settings-panel">
    <h2 style="margin-top:0">Настройки</h2>
    <label style="margin-bottom:8px; color:var(--text-gray)">Номер маршрута</label>
    <input type="text" id="input-bus-number" class="settings-input" placeholder="31">
    <button class="btn-pay-main" onclick="startScanner()" style="margin-top:auto">ГОТОВО (Скан QR)</button>
</div>

<!-- Экран сканера -->
<div id="scanner-screen">
    <div id="reader"></div>
    <div class="scanner-overlay"></div>
    <div style="position:absolute; bottom:40px; width:100%; text-align:center; z-index:1502; font-weight:600;">
        Наведите на QR-код для оплаты
    </div>
</div>

<!-- Экран оплаты -->
<div id="pay-screen" class="screen">
    <div class="top-status-bar"><div class="t-label">Т-БАНК</div></div>
    <div class="header-pay">
        <a href="#" class="close-link" onclick="location.reload()">Закрыть</a>
        <div style="font-weight: 600; font-size: 17px;">Оплата</div>
        <div style="width: 50px;"></div>
    </div>
    <div class="account-card">
        <div style="color: var(--text-gray); font-size: 14px;">с Мой счет</div>
        <div id="initial-balance-display" style="font-size: 30px; font-weight: 700; margin-top: 4px;">0,00 ₽</div>
    </div>
    <div class="recipient-card">
        <div class="bus-icon-circle"><img src="IMG_5710.jpeg" style="width:100%;height:100%;object-fit:cover"></div>
        <div><div style="font-weight: 600;">АО «КПАТП №7»</div><div id="bus-label-pay" style="font-size: 12px; opacity: 0.8;">Маршрут №31</div></div>
    </div>
    <div style="padding: 0 5px;"><div style="font-size: 32px; font-weight: 700;">48 ₽</div><div style="color: var(--text-gray); font-size: 13px; margin-top: 4px;">Комиссия не взимается</div></div>
    <div style="margin-top: auto; padding-bottom: 20px;">
        <button class="btn-pay-main" id="pay-btn">Оплатить 48 ₽</button>
    </div>
</div>

<!-- Анимация -->
<div id="loading-overlay"><div class="spinner"></div></div>
<div id="check-overlay">
    <div class="success-wave" id="wave"></div>
    <div class="success-ring" id="ring">
        <svg width="40" height="30" viewBox="0 0 12 10" fill="none">
            <path d="M1 5L4.5 8.5L11 1" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </div>
    <div class="fade-in-item" id="p-text" style="font-size: 24px; font-weight: 600; margin-top: 25px;">Оплачено!</div>
    <div class="fade-in-item" id="p-amount" style="font-size: 34px; font-weight: 700; margin-top: 10px;">−48 ₽</div>
</div>

<!-- Чек (Экран успеха) -->
<div id="success-screen" class="screen">
    <div class="top-status-bar"><div class="t-label">Т-БАНК</div></div>
    <div class="close-btn-wrapper"><div class="close-circle" onclick="location.reload()">×</div></div>
    
    <div class="receipt-content">
        <div class="fade-in-item" id="current-time-display" style="color: var(--text-gray); font-size: 14px; margin-top: 10px;"></div>
        
        <div class="avatar-main fade-in-item">
            <img src="IMG_5710.jpeg">
        </div>
        
        <div class="fade-in-item" style="text-align: center;">
            <div style="font-size: 19px; font-weight: 600;">КрасноярскАвтоТранс QR</div>
            <div style="display:flex; justify-content:center">
                <div class="transport-badge">
                    <div class="mini-bus-circle"><img src="IMG_5710.jpeg" class="mini-bus-icon"></div>
                    <div class="badge-text">Местный транспорт • MCC 4111</div>
                </div>
            </div>
        </div>

        <div class="fade-in-item" style="font-size: 40px; font-weight: 700; margin: 25px 0;">−48 ₽</div>

        <div class="details-section fade-in-item">
            <div class="details-title">Реквизиты</div>
            
            <div class="detail-row">
                <div class="detail-label">Назначение платежа</div>
                <div id="final-desc" class="detail-value"></div>
            </div>
            
            <div class="detail-row">
                <div class="detail-label">Получатель</div>
                <div class="detail-value">АО «КПАТП №7»</div>
            </div>

            <div class="post-pay-card">
                <div style="font-weight:600; font-size: 15px; margin-bottom:12px">Счет оплаты</div>
                <div class="card-inner">
                    <div class="p-icon">₽</div>
                    <div>
                        <div style="font-size:16px; font-weight: 500;">Мой счет</div>
                        <div style="font-size:13px; color:var(--text-gray); margin-top: 2px;">
                            <span id="final-start"></span> ₽ → <span id="final-end" style="color:#fff"></span> ₽
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed-bottom fade-in-item">
        <button class="btn-pay-main" onclick="location.reload()">Готово</button>
    </div>
</div>

<script>
    let busNum = "31";
    let html5QrCode;
    const startVal = (Math.random() * (450 - 150) + 150);
    const startBalance = startVal.toFixed(2);
    const endBalance = (startVal - 48).toFixed(2);

    function startScanner() {
        busNum = document.getElementById('input-bus-number').value || "31";
        document.getElementById('settings-panel').style.display = 'none';
        document.getElementById('scanner-screen').style.display = 'flex';

        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
            // Как только QR обнаружен
            stopScanner();
            initPayment();
        });
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                document.getElementById('scanner-screen').style.display = 'none';
            });
        }
    }

    function initPayment() {
        document.getElementById('pay-screen').style.display = 'flex';
        document.getElementById('initial-balance-display').innerText = startBalance.replace('.', ',') + ' ₽';
        document.getElementById('bus-label-pay').innerText = `Маршрут №${busNum}`;
    }

    document.getElementById('pay-btn').addEventListener('click', () => {
        const now = new Date();
        const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
        
        document.getElementById('current-time-display').innerText = `${now.getDate()} ${months[now.getMonth()]} • ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
        document.getElementById('final-desc').innerText = `Оплата проезда, маршрут №${busNum}, городской муниципальный / автобус`;
        document.getElementById('final-start').innerText = startBalance.replace('.', ',');
        document.getElementById('final-end').innerText = endBalance.replace('.', ',');

        document.getElementById('pay-screen').classList.add('blur-active');
        document.getElementById('loading-overlay').style.display = 'flex';

        setTimeout(() => {
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('pay-screen').style.display = 'none';
            document.getElementById('check-overlay').style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById('ring').classList.add('ring-animate');
                document.getElementById('wave').classList.add('wave-animate');
                document.getElementById('p-text').classList.add('animate-item');
                document.getElementById('p-amount').classList.add('animate-item');

                setTimeout(() => {
                    document.getElementById('check-overlay').style.display = 'none';
                    document.getElementById('success-screen').style.display = 'block';
                    document.querySelectorAll('#success-screen .fade-in-item').forEach((it, i) => {
                        setTimeout(() => it.classList.add('animate-item'), i * 70);
                    });
                }, 2200);
            }, 100);
        }, 1000);
    });
</script>
</body>
</html>
