<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>T-Bank Mockup</title>
    <style>
        :root {
            --bg-black: #000;
            --card-gray: #1c1c1e;
            --text-gray: #8e8e93;
            --accent-blue: #007aff;
        }

        body {
            margin: 0;
            background: var(--bg-black);
            font-family: -apple-system, sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Главный экран на основе фото */
        .main-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            /* Обрезаем верхнюю часть с батареей и временем через background-position */
            background: url('photo_2026-05-05_15-06-07.jpg') no-repeat;
            background-size: 100%;
            background-position: center -45px; 
        }

        /* Прозрачные кнопки-триггеры */
        .touch-zone {
            position: absolute;
            cursor: pointer;
            background: rgba(255, 255, 255, 0); /* Прозрачные */
        }

        .search-trigger { top: 125px; left: 5%; width: 90%; height: 45px; }
        .account-trigger { top: 610px; left: 5%; width: 90%; height: 90px; }
        .nav-payments { bottom: 0; left: 25%; width: 25%; height: 70px; }

        /* Полноэкранный поиск (как на видео) */
        #searchScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-black);
            z-index: 200;
            display: none;
            padding: 20px;
            box-sizing: border-box;
        }

        .search-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input-wrap {
            flex-grow: 1;
            background: #1c1c1e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 10px;
        }

        #searchInput {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            font-size: 17px;
            outline: none;
        }

        .cancel-btn { color: var(--accent-blue); cursor: pointer; }

        /* Результаты поиска */
        .search-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #1c1c1e;
        }
        .icon-circle { width: 35px; height: 35px; background: #2c2c2e; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* Плавное меню счета (Bottom Sheet) */
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 90vh;
            background: #151517;
            border-radius: 20px 20px 0 0;
            transition: transform 0.4s cubic-bezier(0.32, 1, 0.23, 1);
            z-index: 300;
            padding: 20px;
            box-sizing: border-box;
        }
        .bottom-sheet.active { transform: translateY(-100%); }

        .handle { width: 40px; height: 5px; background: #333; border-radius: 10px; margin: 0 auto 20px; }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            z-index: 250;
        }

        .extra-section {
            background: #1c1c1e;
            border-radius: 15px;
            margin-top: 20px;
            padding: 15px;
        }

        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2c2c2e; }
        .row:last-child { border: none; }
        .label { color: var(--text-gray); }

        .qr-box {
            background: white;
            width: 140px;
            height: 140px;
            margin: 20px auto;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-screen">
        <!-- Кнопки поверх картинки -->
        <div class="touch-zone search-trigger" onclick="toggleSearch(true)"></div>
        <div class="touch-zone account-trigger" onclick="toggleSheet(true)"></div>
    </div>

    <!-- ЭКРАН ПОИСКА -->
    <div id="searchScreen">
        <div class="search-header">
            <div class="search-input-wrap">
                <span style="margin-right: 8px;">🔍</span>
                <input type="text" id="searchInput" placeholder="Поиск">
            </div>
            <div class="cancel-btn" onclick="toggleSearch(false)">Отменить</div>
        </div>
        
        <div id="searchResults">
            <div class="search-item">
                <div class="icon-circle">🔥</div>
                <div>Топливо</div>
            </div>
            <div class="search-item">
                <div class="icon-circle">🎮</div>
                <div>Игра «Квизи»</div>
            </div>
            <div class="search-item">
                <div class="icon-circle">🔠</div>
                <div>Игра «5 букв»</div>
            </div>
        </div>
    </div>

    <!-- МЕНЮ СЧЕТА -->
    <div class="overlay" id="overlay" onclick="toggleSheet(false)"></div>
    <div class="bottom-sheet" id="accountSheet">
        <div class="handle"></div>
        <h2>Мой счет</h2>
        <div style="font-size: 32px; font-weight: bold; margin-bottom: 5px;">5,41 ₽</div>
        <div style="color: var(--text-gray); margin-bottom: 25px;">+ 124 балла лояльности</div>

        <div class="qr-box">QR CODE</div>
        <p style="text-align: center; color: var(--text-gray); font-size: 14px;">Ссылка для пополнения</p>

        <div class="extra-section">
            <h4 style="margin: 0 0 10px 0;">Дополнительно</h4>
            <div class="row"><span class="label">Тариф</span><span>Black</span></div>
            <div class="row"><span class="label">Лимит на переводы</span><span>150 000 ₽</span></div>
            <div class="row"><span class="label">Снятие без комиссии</span><span>До 100 000 ₽</span></div>
            <div class="row"><span class="label">Реквизиты</span><span style="color:var(--accent-blue)">Показать</span></div>
        </div>
        
        <button onclick="toggleSheet(false)" style="width:100%; background:#2c2c2e; border:none; color:white; padding:15px; border-radius:12px; margin-top:20px; font-weight:600;">Закрыть</button>
    </div>

    <script>
        function toggleSearch(show) {
            document.getElementById('searchScreen').style.display = show ? 'block' : 'none';
            if(show) document.getElementById('searchInput').focus();
        }

        function toggleSheet(show) {
            const sheet = document.getElementById('accountSheet');
            const overlay = document.getElementById('overlay');
            if(show) {
                sheet.classList.add('active');
                overlay.style.display = 'block';
            } else {
                sheet.classList.remove('active');
                overlay.style.display = 'none';
            }
        }

        // Логика фильтрации в поиске
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.search-item').forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(val) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>
