<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мой Мессенджер</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; background: #f0f2f5; }
        #chat { width: 90%; max-width: 500px; height: 400px; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow-y: scroll; margin-top: 20px; }
        .controls { width: 90%; max-width: 540px; display: flex; gap: 10px; margin-top: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #0084ff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Локальный чат</h2>
    <div id="chat"></div>
    <div class="controls">
        <input id="name" placeholder="Ваше имя">
        <input id="msg" placeholder="Сообщение...">
        <button onclick="send()">Отправить</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        function send() {
            const name = document.getElementById('name').value || 'Аноним';
            const msg = document.getElementById('msg').value;
            if(!msg) return;
            
            const p = document.createElement('p');
            p.innerHTML = `<strong>${name}:</strong> ${msg}`;
            chat.appendChild(p);
            document.getElementById('msg').value = '';
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
