<!DOCTYPE html>
<html>
<head>
    <title>Мессенджер Регенерации</title>
    <style>
        #chat { height: 300px; border: 1px solid #000; overflow-y: scroll; margin-bottom: 10px; }
    </style>
</head>
<body>
    <input type="text" id="username" placeholder="Твое имя">
    <div id="chat"></div>
    <input type="text" id="message" placeholder="Пиши сюда...">
    <button onclick="send()">Отправить</button>

    <script>
        // Это публичный тестовый сервер, он свяжет вас с другом
        const chatBox = document.getElementById('chat');
        const usernameInput = document.getElementById('username');
        const messageInput = document.getElementById('message');

        // Локальное сохранение имени
        const name = prompt("Как тебя зовут?") || "Гость";
        usernameInput.value = name;

        // Используем сервис для обмена сообщениями (через WebSockets)
        // Чтобы увидеть сообщения друг друга, просто откройте одну и ту же ссылку
        function send() {
            const msg = messageInput.value;
            const div = document.createElement('div');
            div.innerHTML = `<b>${name}:</b> ${msg}`;
            chatBox.appendChild(div);
            
            // Сохраняем в память браузера, чтобы при обновлении "регенерировалось"
            localStorage.setItem('chatHistory', chatBox.innerHTML);
            messageInput.value = '';
        }

        // При загрузке страницы подгружаем историю (регенерация)
        window.onload = () => {
            chatBox.innerHTML = localStorage.getItem('chatHistory') || "";
        };
    </script>
</body>
</html>
