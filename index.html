<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Наш Мессенджер</title>
    <style>
        #chat { height: 300px; border: 2px solid #333; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        input { padding: 5px; }
    </style>
</head>
<body>
    <h3>Мессенджер</h3>
    <input type="text" id="name" placeholder="Ваше имя">
    <div id="chat">Загрузка чата...</div>
    <input type="text" id="msg" placeholder="Сообщение...">
    <button onclick="sendMessage()">Отправить</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        // ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ FIREBASE
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_ПРОЕКТ.firebaseapp.com",
            databaseURL: "https://ВАШ_ПРОЕКТ.firebaseio.com",
            projectId: "ВАШ_ПРОЕКТ",
            storageBucket: "ВАШ_ПРОЕКТ.appspot.com",
            messagingSenderId: "ВАШ_ID",
            appId: "ВАШ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'messages');

        // Отправка сообщения
        window.sendMessage = () => {
            const name = document.getElementById('name').value || 'Аноним';
            const text = document.getElementById('msg').value;
            if(text) {
                push(chatRef, { name: name, text: text, time: Date.now() });
                document.getElementById('msg').value = '';
            }
        };

        // ТУТ МАГИЯ: этот код постоянно следит за новыми сообщениями
        onValue(query(chatRef, limitToLast(20)), (snapshot) => {
            const chatBox = document.getElementById('chat');
            chatBox.innerHTML = ''; // Очищаем экран
            snapshot.forEach((child) => {
                const data = child.val();
                chatBox.innerHTML += `<div><b>${data.name}:</b> ${data.text}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight; // Прокрутка вниз
        });
    </script>
</body>
</html>
