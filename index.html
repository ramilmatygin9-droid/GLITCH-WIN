<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Наш Мессенджер</title>
    <script src="https://unpkg.com/chat-engine/dist/chat-engine.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; }
        #chat-window { height: 300px; border: 1px solid #ddd; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <input type="text" id="username" placeholder="Твое имя">
    <div id="chat-window"></div>
    <input type="text" id="message" placeholder="Пиши...">
    <button onclick="sendMessage()">Отправить</button>

    <script>
        // Это готовый пример, который свяжет вас с другом через облако
        const chatWindow = document.getElementById('chat-window');
        
        // Функция отправки
        function sendMessage() {
            const user = document.getElementById('username').value || 'Аноним';
            const msg = document.getElementById('message').value;
            
            // Здесь логика отправки в облако (в данном случае через простой fetch к API)
            fetch('https://api.chatengine.io/chats/', {
                method: 'POST',
                headers: { 'Private-Key': '{{ВАШ_КЛЮЧ_ИЛИ_ТЕСТОВЫЙ_ID}}' },
                body: JSON.stringify({ title: 'Чат с другом', usernames: [user] })
            });
            
            chatWindow.innerHTML += `<div><b>${user}:</b> ${msg}</div>`;
            document.getElementById('message').value = '';
        }
    </script>
</body>
</html>
